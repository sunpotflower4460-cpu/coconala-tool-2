name: 不具合報告
description: アプリが仕様どおりに動かない場合に報告してください
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 何が起きましたか
      description: 期待した動作と、実際に起きた動作を書いてください
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS・バージョン
      placeholder: 例) macOS 15.2 / Windows 11
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: アプリのバージョン
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 診断ファイルの内容
      description: 「診断情報を保存する」で作成したファイルの内容を貼り付けてください(APIキーや顧客情報は含まれません)
