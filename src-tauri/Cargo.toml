[package]
name = "mitsumori-desk"
version = "0.1.0"
description = "見積・請求書デスク(ローカル完結の買い切り見積・請求書アプリ)"
authors = ["見積・請求書デスク 販売者"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mitsumori_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4.1.5", features = ["apple-native-keyring-store"] }
rusqlite = { version = "0.32", features = ["bundled"] }


# 二重起動を防ぐ(同じDBファイルを2つのプロセスで開かないため。CONC-08)。
# Linuxは購入者へ配布しない開発・CI用のため対象外(E2E環境のD-Bus依存を避ける)。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"
